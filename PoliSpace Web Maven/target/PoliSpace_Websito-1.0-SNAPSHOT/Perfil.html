<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/General.css"/>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
              
        <main class="main-content">
            <header class="topbar">
                <h2 class="title-large">Perfil</h2>
                <div class="search-bar">
                    <input type="text" placeholder="Buscar...">
                </div>
                <div>
                    <img src="Imagenes/Notis.png" alt="Notificaciones" class="nav-icon">
                </div>
                <div class="avatar">D</div>
            </header>
            <div class="cards-grid">
                  <div class="perfil-container">
                <!-- Tarjeta superior de cabecera de perfil -->
                <div class="profile-header-card">

                    <!-- Contenedor flexible para poner el círculo y el texto lado a lado -->
                    <div class="profile-user-info">
                        <!-- Círculo del perfil más grande -->
                        <div class="avatar-circle">
                            <span class="avatar-letter">D</span>
                            <!-- Cuando decidas poner imagen, puedes usar: -->
                            <!-- <img src="ruta-de-foto.jpg" alt="Foto de perfil" class="profile-img"> -->
                        </div>

                        <!-- Textos de nombre y subtítulo juntos -->
                        <div class="profile-text-details">
                            <h1 class="profile-name">Danae</h1>
                            <p class="profile-subtitle">CECyT 9 &bull; Grupo 5IM7 &bull; Estudiante (Alumno)</p>
                        </div>
                    </div>

                    <!-- Botón de editar perfil alineado a la derecha -->
                    <button class="btn-editar">Editar perfil</button>
                </div>

            <!-- Resto de tus secciones (Información Académica y Preferencias) -->
            <!-- ... -->
        </div>
                 </div>
            <div class="cards-grid">
               
                <div class="card">
                    <p class="title-large">Información Academica</p>
                    <p class="subtitle">Matricula</p>
                    <h3 class="section-title">2025090000</h3>
                    <p class="subtitle">Grupo</p>
                    <h3 class="section-title">5IM7</h3>
                    <p class="subtitle">Institucion</p>
                    <h3 class="section-title">CECyT 9 Juan de Dios Bátiz</h3>
                    <p class="subtitle">Carrera</p>
                    <h3 class="section-title">Tecnico en Programación</h3>
                </div>
                <div class="card">
                     <h3 class="section-title">Preferencias</h3>
                     
            
            <div class="preference-item">
                <span>Notificaciones académicas</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="preference-item">
                <span>Avisos de comunidad</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="preference-item">
                <span>Recordatorios de clases</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
                </div>
            </div>
        </main>
    </div>
        <script src="main.js"></script>

    </body>
</html>
