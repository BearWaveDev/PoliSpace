<html lang="es">
    <head>
        <title>PoliSpace - Iniciar sesión</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    
    <body>
        <link href="estilos/iniciarsesion.css" rel="stylesheet" />
  <div class="login-page">
    <aside class="brand-panel">
      <div class="brand-content">
        <h1 class="logo">PoliSpace</h1>
        <p class="tagline">ESTUDIA · CONECTA · AVANZA</p>
        <p class="description">Tu comunidad politécnica, en un solo espacio.</p>

        <div class="ipn-card">
          <span class="ipn-title">IPN</span>
          <span class="ipn-subtitle">CECyT 9 · Juan de Dios Bátiz</span>
        </div>
      </div>
    </aside>

    <main class="form-panel">
      <div class="form-card">
        <div class="logo-mobile">
          <img src="Imagenes/Logo2.png" alt="PoliSpace" width="64" height="64">
        </div>

        <h2>Iniciar sesión</h2>
        <p class="subtitle">Alumnos, prefectos y administradores entran aquí</p>
        <p id="msg" class="subtitle" style="font-weight:600;"></p>

        <form action="LoginServlet" method="POST">
          <div class="field">
            <label for="user">Boleta, número de empleado o usuario</label>
            <input type="text" id="user" name="usuario" placeholder="Boleta, número de empleado o usuario" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" name="password" placeholder="Contraseña" autocomplete="current-password" required>
          </div>
            
            
          <button type="submit" class="btn-primary">Entrar</button>

            
        </form>

        <p class="register-link">
          ¿No tienes cuenta? <a href="Rol.html">Regístrate</a>
        </p>

        <p class="legal">
          Al registrarte aceptas las normas de usuario y las políticas de privacidad.
        </p>
      </div>
    </main>
  </div>
<script>
  var p = new URLSearchParams(location.search), m = document.getElementById("msg");
  var ok = "#1b7f3b", mal = "#b00020";
  var avisos = {
    "registro=ok": [ok, "¡Registro exitoso! Ya puedes iniciar sesión."],
    "registro=pendiente": [ok, "Registro enviado. Un administrador debe activar tu cuenta de prefecto antes de que puedas entrar."],
    "error=credenciales": [mal, "Usuario o contraseña incorrectos."],
    "error=pendiente": [mal, "Tu cuenta está pendiente de activación por un administrador."],
    "error=bloqueado": [mal, "Tu cuenta está inactiva o bloqueada. Contacta a un administrador."],
    "error=intentos": [mal, "Demasiados intentos fallidos. Espera 5 minutos e inténtalo de nuevo."],
    "error=sesion": [mal, "Inicia sesión para continuar."],
    "error=bd": [mal, "Error con la base de datos. Intenta más tarde."]
  };
  ["registro", "error"].forEach(function (k) {
    var a = p.get(k) && avisos[k + "=" + p.get(k)];
    if (a) { m.style.color = a[0]; m.textContent = a[1]; }
  });
</script>
</body>
</html>
