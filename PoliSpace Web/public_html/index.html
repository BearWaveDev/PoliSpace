<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PoliSpace</title>

  <link rel="stylesheet" href="estilos/registro.css">
</head>
<body>
  <div class="welcome-page">
    <section class="brand-panel">
      <div class="brand-content">
        <h1 class="logo">
          PoliSpace
        </h1>
        <p class="tagline">
          ESTUDIA · CONECTA · AVANZA
        </p>
        <p class="description">
          Tu comunidad politécnica, en un solo espacio.
        </p>
      </div>
    </section>
    <main class="welcome-panel">
      <div class="welcome-card">
        <div class="app-icon">
          <img
            src="imagenes/logo.png" alt="PoliSpace" width="72" height="72"
          >
        </div>
        <h2>
          ¡Bienvenido!
        </h2>
        <p class="subtitle">
          Selecciona una opción para continuar
        </p>


        <div class="actions">
          <a
            href="iniciarsesion.html" class="btn btn-primary">
            Iniciar Sesión
          </a>
          <a
            href="Rol.html" class="btn btn-outline">
            Registrarse
          </a>

        </div>

        <p class="legal">
          Al registrarte aceptas las normas de usuario
          y las políticas de privacidad.
        </p>

      </div>
    </main>
  </div>
</body>
</html>
