<!DOCTYPE html>

                </a>
                <a href="Perfil.html" class="sidebar-nav-item">
                    <img src="imagenes/perfil.png" alt="Perfil" class="nav-icon">

                </a>
                <a href="Horario.html" class="sidebar-nav-item">
                    <img src="imagenes/horario.png" alt="Horario" class="nav-icon">
                    <span>Horario</span>
                </a>
                <a href="Profesor.html" class="sidebar-nav-item">
                    <img src="imagenes/perfil.png" alt="Profesor" class="nav-icon">

                </a>
                <a href="Publicaciones.html" class="sidebar-nav-item">

                <a href="MarketPlace.html" class="sidebar-nav-item">
                    <img src="imagenes/market.png" alt="Market" class="nav-icon">

                </a>
            </nav>
            <a href="index.html" class="sidebar-nav-item">Cerrar sesión</a>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2 class="title-large">Inicio</h2>
                <div class="search-bar">
                    <input type="text" placeholder="Buscar...">

                <div>

                </div>
                <div class="avatar">D</div>

            <h1 class="title-large">Buenas, Danae</h1>

            <div class="cards-grid">
                <div class="card">
                    <p class="subtitle">Clases de hoy</p>
                    <h2 class="title-large">4</h2>
                </div>
                <div class="card">
                    <p class="subtitle">Materiales Nuevos</p>
                    <h2 class="title-large">8</h2>
                </div>
                <div class="card">
                    <p class="subtitle">Mensajes Pendientes</p>
                    <h2 class="title-large">3</h2>
                </div>
            </div>

            <div class="cards-grid" style="margin-top: 24px;">
                <div class="card">
                    <p class="subtitle"><strong>Proxima Clase</strong></p>
                    <h2 class="title-large"><strong>Fisica</strong></h2>
                </div>
                <div class="card">
                    <p class="subtitle"><strong>Accesos Rapidos</strong></p>
                    <h2 class="title-large"></h2>
