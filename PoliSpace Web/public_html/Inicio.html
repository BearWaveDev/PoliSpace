<!DOCTYPE html>
<html lang="es">
<head>
    <title>PoliSpace - Inicio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/General.css"/>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
              
        <main class="main-content">
            <header class="topbar">
                <h2 class="title-large">Inicio</h2>
                <div class="search-bar">
                    <input type="text" placeholder="Buscar...">
                </div>
                <div>
                    <img src="Imagenes/Notis.png" alt="Notificaciones" class="nav-icon">
                </div>
                <div class="avatar">D</div>
            </header>

            <h1 class="title-large">Buenas, Danae</h1>
            <p class="subtitle">Todo lo que necesitas para tu vida académica.</p>
            
            <div class="cards-grid">
                <div class="card">
                    <p class="subtitle">Clases de hoy</p>
                    <h2 class="title-large">4</h2>
                </div>
                <div class="card">
                    <p class="subtitle">Materiales Nuevos</p>
                    <h2 class="title-large">8</h2>
                </div>
                <div class="card">
                    <p class="subtitle">Mensajes Pendientes</p>
                    <h2 class="title-large">3</h2>
                </div>
            </div>

            <div class="cards-grid" style="margin-top: 24px;">
                <div class="card">
                    <p class="subtitle"><strong>Proxima Clase</strong></p>
                    <h2 class="title-large"><strong>Fisica</strong></h2>
                </div>
                <div class="card">
                    <p class="subtitle"><strong>Accesos Rapidos</strong></p>
                    <h2 class="title-large"></h2>
                </div>
            </div>
        </main>
    </div>

    //Script que carga la barra lateral
    <script src="main.js"></script>
</body>
</html>
