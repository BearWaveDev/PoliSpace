<!DOCTYPE html>
<html lang="es">
    <head>
        <title>PoliSpace - Seleccionar Rol</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilos/registrar.css">
    </head>
    <body>
        <div class="login-page">

            <section class="brand-panel">
              <div class="brand-content">
                <h1 class="logo">PoliSpace</h1>
                <p class="tagline">
                  ESTUDIA · CONECTA · AVANZA
                </p>
                <p class="description">
                  Tu comunidad politécnica, en un solo espacio.
                </p>
                <div class="ipn-card">
                  <span class="ipn-title">IPN</span>
                  <span class="ipn-subtitle">
                    Centro de Estudios Cientificos y Tecnologicos
                  </span>
                </div>
              </div>
            </section>
                 
            <section class="form-panel">
              <div class="form-card">

                <div class="logo-mobile">
                  <img src="Imagenes/Logo2.png" alt="PoliSpace" width="72" height="72">
                </div>
                
                <h2>Selecciona una opción</h2>
                <p class="subtitle">Elije tu Rol</p>
                
                <form>
                    <!-- Opción Prefecto -->
                    <label class="radio-politecnico">
                        <input type="radio" id="Prefecto" name="Rol" value="Prefecto" checked>
                        <span class="circulo-custom"></span>
                        <span class="texto-opcion">Prefecto</span>
                    </label>

                    <br>

                    <!-- Opción Alumno -->
                    <label class="radio-politecnico">
                        <input type="radio" id="Alumno" name="Rol" value="Alumno">
                        <span class="circulo-custom"></span>
                        <span class="texto-opcion">Alumno</span>
                    </label>
                </form>
                
                <a href="Registrar.jsp">
                   <button type="button" class="btn-primary">Entrar</button>
                </a>
                
              </div>
           </section>
        </div>
    </body>
</html>
